[project]
name = "lazycontrib"
version = "0.1.0"
description = "Finds open source issues that fit you, checks they are free and that the project welcomes your kind of help, and drafts a plan. You stay the author."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.8", "pyyaml>=6"]

[project.optional-dependencies]
rank = ["tabpfn>=2", "scikit-learn>=1.5"]
dev = ["pytest>=8"]

[project.scripts]
lazycontrib = "lazycontrib.cli:main"

[tool.setuptools]
packages = ["lazycontrib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
